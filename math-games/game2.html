<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тригонометрический квест - Математика без слёз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2a1a 0%, #1a3a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            width: 1100px;
            max-width: 100%;
            background: #f5e6d3;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #c9b27c;
        }
        .screen {
            padding: 25px;
            min-height: 650px;
            display: flex;
            flex-direction: column;
        }
        .hidden { display: none; }
        
        .start-screen {
            text-align: center;
            background: linear-gradient(135deg, #c49a6c 0%, #8b5a2b 100%);
            color: white;
            justify-content: center;
            align-items: center;
        }
        .start-screen h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .start-btn {
            background: #ffaa44;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .warning {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 0.8rem;
        }
        
        .map-screen { background: #f0e6d0; }
        .map-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #d9b48b;
            border-radius: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-box {
            background: #4a2a0e;
            color: #ffaa44;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        .lives-box {
            background: #4a2a0e;
            color: #ff6666;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        .shop-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        .debt-badge {
            background: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.7rem;
        }
        .locations-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            max-height: 450px;
            overflow-y: auto;
            padding: 5px;
        }
        .location-card {
            background: #fff0e0;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #c9b27c;
        }
        .location-card:hover { transform: scale(1.02); border-color: #ffaa44; }
        .location-card.completed { background: #d4edda; border-color: #28a745; }
        .location-card.locked { opacity: 0.6; cursor: not-allowed; background: #e0d0c0; }
        .location-emoji { font-size: 2rem; }
        .location-name { font-size: 1rem; font-weight: bold; margin: 5px 0; }
        .location-progress { font-size: 0.7rem; color: #666; }
        
        .task-screen { background: #f0e6d0; }
        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #d9b48b;
            border-radius: 20px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
        }
        .task-area {
            background: #fff8e8;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
        .task-emoji { font-size: 3rem; margin-bottom: 10px; }
        .task-text { font-size: 1.2rem; margin-bottom: 10px; font-family: monospace; }
        .answer-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .answer-input {
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 25px;
            border: 2px solid #c9b27c;
            width: 200px;
        }
        .submit-btn {
            background: #ffaa44;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
        }
        .feedback.correct { background: #d4edda; color: #155724; }
        .feedback.wrong { background: #f8d7da; color: #721c24; }
        .feedback.hint { background: #fff3cd; color: #856404; }
        
        .shop-screen {
            background: #f0e6d0;
            text-align: center;
        }
        .shop-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .shop-category {
            background: #fff0e0;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #c9b27c;
        }
        .shop-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-item:hover { transform: scale(1.02); background: #ffaa44; color: white; }
        .shop-item.owned { opacity: 0.6; background: #ccc; cursor: default; }
        .item-price { color: #ffaa44; font-weight: bold; margin-top: 5px; }
        
        .shelf-screen {
            background: #f0e6d0;
            text-align: center;
        }
        .accessories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .accessory-card {
            background: #fff0e0;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid #c9b27c;
        }
        .accessory-emoji { font-size: 2rem; }
        
        .result-screen {
            text-align: center;
            justify-content: center;
            align-items: center;
            background: #f0e6d0;
        }
        .chest {
            font-size: 5rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 20px;
            display: inline-block;
        }
        .chest:hover { transform: scale(1.1); }
        .active-character {
            background: #ffaa44;
            color: #4a2a0e;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div id="startScreen" class="screen start-screen">
        <h1>🗺️ ТРИГОНОМЕТРИЧЕСКИЙ КВЕСТ 🗺️</h1>
        <p>Найди сокровище, решая задачи по геометрии!</p>
        <div class="warning">⚠️ ВНИМАНИЕ! При выходе из игры весь прогресс будет сброшен!</div>
        <button class="start-btn" id="startBtn">🎒 НАЧАТЬ ПУТЕШЕСТВИЕ</button>
    </div>

    <div id="mapScreen" class="screen hidden">
        <div class="map-header">
            <div class="score-box">💰 МОНЕТЫ: <span id="totalCoins">0</span></div>
            <div class="lives-box">❤️ ЖИЗНИ: <span id="lives">3</span></div>
            <div class="debt-badge" id="debtBadge" style="display:none;">💸 ДОЛГ: <span id="debtAmount">0</span></div>
            <div class="active-character" id="activeCharDisplay">👩‍🎓 Анна</div>
            <button class="shop-btn" id="openShopBtn">🛍️ МАГАЗИН</button>
            <button class="shop-btn" id="openShelfBtn">🏆 ПОЛКА</button>
        </div>
        <div class="locations-grid" id="locationsGrid"></div>
        <button class="back-btn" id="exitToStartBtn">🚪 ВЫХОД</button>
    </div>

    <div id="taskScreen" class="screen hidden">
        <div class="task-header">
            <button class="back-btn" id="backToMapBtn">← НА КАРТУ</button>
            <div class="score-box">💰 <span id="taskCoins">0</span></div>
            <div class="lives-box">❤️ <span id="taskLives">3</span></div>
        </div>
        <div class="task-area">
            <div class="task-emoji" id="taskEmoji">🌲</div>
            <div class="task-text" id="taskText"></div>
            <div class="answer-area">
                <input type="text" id="answerInput" class="answer-input" placeholder="Введите ответ">
                <button class="submit-btn" id="submitBtn">🔍 ПРОВЕРИТЬ</button>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <div id="shopScreen" class="screen hidden">
        <h2>🛍️ МАГАЗИН 🛍️</h2>
        <div class="shop-items" id="shopItems"></div>
        <button class="back-btn" id="closeShopBtn">🔙 НА КАРТУ</button>
    </div>

    <div id="shelfScreen" class="screen hidden">
        <h2>🏆 ПОЛКА АКСЕССУАРОВ 🏆</h2>
        <div class="accessories-grid" id="accessoriesGrid"></div>
        <button class="back-btn" id="closeShelfBtn">🔙 НА КАРТУ</button>
    </div>

    <div id="resultScreen" class="screen hidden">
        <h2>ВЫ ПРОШЛИ ВСЕ ЛОКАЦИИ!</h2>
        <div id="finalChest" class="chest">🎁</div>
        <p>Нажми на сундук, чтобы получить награду!</p>
        <div id="chestResult"></div>
        <button class="start-btn" id="playAgainBtn">🔄 СЫГРАТЬ СНОВА</button>
        <button class="back-btn" id="exitResultBtn">🚪 ВЫХОД</button>
    </div>
</div>

<script>
    // ==================== ДАННЫЕ ====================
    let totalCoins = 0;
    let lives = 3;
    let currentLocation = 0;
    let currentTaskIndex = 0;
    let currentTask = null;
    let waitingForNext = false;
    let finalChestOpened = false;
    let debt = 0;
    let errorCount = 0; // Счётчик ошибок для текущего задания
    
    let accessories = [];
    let ownedCharacters = ['Анна'];

    const characterBuffs = {

        { name: "Пришелец", emoji: "👽", price: 1000, description: "Гость из космоса", buff: characterBuffs['Пришелец'] }

    const shopItems = [
        { id: 'heart', name: '💖 ДОП. ЖИЗНЬ', price: 200, desc: '+1 жизнь', effect: 'heart', emoji: '💖' },
        { id: 'shield', name: '🛡️ БРОНЯ', price: 300, desc: 'Защищает от 1 потери жизни', effect: 'shield', emoji: '🛡️' },
        { id: 'credit', name: '🏦 КРЕДИТ', price: 0, desc: 'Взять 500 монет в долг (+100 к возврату)', effect: 'credit', emoji: '🏦' },
        { id: 'chest', name: '🎁 ТАИНСТВЕННЫЙ СУНДУК', price: 10000, desc: 'Случайный аксессуар (обычный-легендарный)', effect: 'chest', emoji: '🎁' }
    ];
    
    let shieldActive = false;
    
    // 12 ЛОКАЦИЙ
    const locations = [
        { name: "🌲 ЛЕС", emoji: "🌲", tasks: [
            { text: "Прямоугольный треугольник: катеты 3 и 4. Найдите гипотенузу.", answer: "5", hint: "a² + b² = c²" },
            { text: "Квадрат со стороной 5 см. Найдите его площадь.", answer: "25", hint: "S = a²" },
            { text: "У прямоугольника длина 8, ширина 3. Найдите периметр.", answer: "22", hint: "P = 2(a+b)" }
        ]},
        { name: "🏜️ ПУСТЫНЯ", emoji: "🏜️", tasks: [
            { text: "Прямоугольный треугольник: катет 6, гипотенуза 10. Найдите второй катет.", answer: "8", hint: "b² = c² - a²" },
            { text: "Прямоугольник: длина 12, ширина 5. Найдите площадь.", answer: "60", hint: "S = a × b" },
            { text: "У квадрата периметр 32 см. Найдите сторону.", answer: "8", hint: "a = P/4" }
        ]},
        { name: "⛰️ ГОРЫ", emoji: "⛰️", tasks: [
            { text: "Прямоугольный треугольник: катеты 5 и 12. Найдите гипотенузу.", answer: "13", hint: "a² + b² = c²" },
            { text: "Ромб: диагонали 6 и 8. Найдите площадь.", answer: "24", hint: "S = (d1 × d2)/2" },
            { text: "У прямоугольника площадь 48, ширина 6. Найдите длину.", answer: "8", hint: "a = S / b" }
        ]},
        { name: "🏯 БАШНЯ", emoji: "🏯", tasks: [
            { text: "Прямоугольный треугольник: катет 9, гипотенуза 15. Найдите второй катет.", answer: "12", hint: "b² = c² - a²" },
            { text: "Квадрат со стороной 7. Найдите периметр.", answer: "28", hint: "P = 4a" },
            { text: "Прямоугольник: длина 15, ширина 4. Найдите площадь.", answer: "60", hint: "S = a × b" }
        ]},
        { name: "🕯️ ПЕЩЕРА", emoji: "🕯️", tasks: [
            { text: "Прямоугольный треугольник: катеты 8 и 15. Найдите гипотенузу.", answer: "17", hint: "a² + b² = c²" },
            { text: "Параллелограмм: основание 10, высота 6. Найдите площадь.", answer: "60", hint: "S = a × h" },
            { text: "У квадрата площадь 64. Найдите сторону.", answer: "8", hint: "a = √S" }
        ]},

            { text: "Прямоугольник: длина 18, ширина 7. Найдите периметр.", answer: "50", hint: "P = 2(a+b)" },
            { text: "Ромб: сторона 10, высота 8. Найдите площадь.", answer: "80", hint: "S = a × h" }
        ]},
        { name: "🏞️ ДОЛИНА", emoji: "🏞️", tasks: [
            { text: "Прямоугольный треугольник: катет 20, гипотенуза 25. Найдите второй катет.", answer: "15", hint: "b² = c² - a²" },
            { text: "Квадрат со стороной 9. Найдите площадь.", answer: "81", hint: "S = a²" },
            { text: "У прямоугольника периметр 40, длина 12. Найдите ширину.", answer: "8", hint: "b = P/2 - a" }
        ]},
        { name: "🏰 ЗАМОК", emoji: "🏰", tasks: [
            { text: "Прямоугольный треугольник: катеты 9 и 12. Найдите гипотенузу.", answer: "15", hint: "a² + b² = c²" },
            { text: "Трапеция: основания 8 и 12, высота 5. Найдите площадь.", answer: "50", hint: "S = (a+b)/2 × h" },
            { text: "У квадрата периметр 36. Найдите сторону.", answer: "9", hint: "a = P/4" }
        ]},
        { name: "🌋 ВУЛКАН", emoji: "🌋", tasks: [
            { text: "Прямоугольный треугольник: катет 16, гипотенуза 20. Найдите второй катет.", answer: "12", hint: "b² = c² - a²" },
            { text: "Прямоугольник: длина 14, ширина 9. Найдите площадь.", answer: "126", hint: "S = a × b" },
            { text: "У прямоугольника периметр 44, ширина 10. Найдите длину.", answer: "12", hint: "a = P/2 - b" }
        ]},
        { name: "❄️ ЛЕДНИК", emoji: "❄️", tasks: [
            { text: "Прямоугольный треугольник: катеты 10 и 24. Найдите гипотенузу.", answer: "26", hint: "a² + b² = c²" },
            { text: "Квадрат со стороной 11. Найдите периметр.", answer: "44", hint: "P = 4a" },
            { text: "Ромб: диагонали 10 и 24. Найдите площадь.", answer: "120", hint: "S = (d1 × d2)/2" }
        ]},
        { name: "🏝️ ОСТРОВ", emoji: "🏝️", tasks: [
            { text: "Прямоугольный треугольник: катет 21, гипотенуза 29. Найдите второй катет.", answer: "20", hint: "b² = c² - a²" },
            { text: "Прямоугольник: длина 20, ширина 15. Найдите периметр.", answer: "70", hint: "P = 2(a+b)" },
            { text: "Параллелограмм: основание 12, высота 7. Найдите площадь.", answer: "84", hint: "S = a × h" }
        ]},
        { name: "✨ СОКРОВИЩЕ", emoji: "✨", tasks: [
            { text: "Прямоугольный треугольник: катеты 28 и 45. Найдите гипотенузу.", answer: "53", hint: "a² + b² = c²" },
            { text: "Квадрат со стороной 15. Найдите периметр.", answer: "60", hint: "P = 4a" },
            { text: "Прямоугольник: длина 25, ширина 12. Найдите площадь.", answer: "300", hint: "S = a × b" }
        ]}
    ];
    
    let locationProgress = [];
    
    function resetAllProgress() {
        totalCoins = 0;
        lives = 3;
        accessories = [];
        ownedCharacters = ['Анна'];
        activeCharacter = 'Анна';
        shieldActive = false;
        finalChestOpened = false;
        debt = 0;
        initProgress();
    }
    
    function initProgress() {
        locationProgress = [];
        for (let i = 0; i < locations.length; i++) {
            locationProgress.push({
                completed: false,
                tasks: locations[i].tasks.map(() => false)
            });
        }
    }
    
    function getRewardBonus() {
        const buff = characterBuffs[activeCharacter];
        let bonus = 0;
        if (buff.rewardBonus) bonus += buff.rewardBonus;
        if (activeCharacter === 'Пришелец') bonus = Math.floor(totalCoins * 0.05);
        return bonus;
    }
    
    function updateDebtUI() {
        const debtBadge = document.getElementById('debtBadge');
        const debtSpan = document.getElementById('debtAmount');
        if (debt > 0) {
            debtBadge.style.display = 'inline-block';
            debtSpan.innerHTML = debt;
        } else {
            debtBadge.style.display = 'none';
        }
    }
    
    function updateMapUI() {
        const grid = document.getElementById('locationsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        // Определяем, какая локация доступна
        let firstIncompleteIndex = -1;
        for (let i = 0; i < locationProgress.length; i++) {
            if (!locationProgress[i].completed) {
                firstIncompleteIndex = i;
                break;
            }
        }
        
        locations.forEach((loc, idx) => {
            const progress = locationProgress[idx];
            const completedCount = progress.tasks.filter(t => t).length;
            const isUnlocked = idx <= firstIncompleteIndex;
            
            const card = document.createElement('div');
            card.className = 'location-card';
            if (progress.completed) card.classList.add('completed');
            else if (!isUnlocked) card.classList.add('locked');
            
            card.innerHTML = `
                <div class="location-emoji">${loc.emoji}</div>
                <div class="location-name">${loc.name}</div>
                <div class="location-progress">📋 ${completedCount}/${loc.tasks.length}</div>
            `;
            
            if (isUnlocked && !progress.completed) {
                card.onclick = () => openLocation(idx);
            }
            
            grid.appendChild(card);
        });
        
        document.getElementById('totalCoins').innerHTML = totalCoins;
        document.getElementById('lives').innerHTML = lives;
        updateDebtUI();
        
        const charDisplay = document.getElementById('activeCharDisplay');
        if (charDisplay) {
            const char = characters.find(c => c.name === activeCharacter);
            charDisplay.innerHTML = `${char.emoji} ${activeCharacter} ${characterBuffs[activeCharacter].desc}`;
        }
    }
    
    function openLocation(locationIdx) {
        if (lives <= 0) {
            alert('У вас закончились жизни! Начните игру заново.');
            return;
        }
        
        currentLocation = locationIdx;
        currentTaskIndex = 0;
        errorCount = 0;
        
        const progress = locationProgress[locationIdx];
        for (let i = 0; i < progress.tasks.length; i++) {
            if (!progress.tasks[i]) {
                currentTaskIndex = i;
                break;
            }
        }
        
        loadTask();
        document.getElementById('mapScreen').classList.add('hidden');
        document.getElementById('taskScreen').classList.remove('hidden');
    }
    
    function loadTask() {
        waitingForNext = false;
        errorCount = 0;
        const location = locations[currentLocation];
        const task = location.tasks[currentTaskIndex];
        currentTask = task;
        
        document.getElementById('taskEmoji').innerHTML = location.emoji;
        document.getElementById('taskText').innerHTML = task.text;
        document.getElementById('taskCoins').innerHTML = totalCoins;
        document.getElementById('taskLives').innerHTML = lives;
        document.getElementById('answerInput').value = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerHTML = '';
    }
    
    function checkAnswer() {
        if (waitingForNext) return;
        
        const userAnswer = document.getElementById('answerInput').value.trim();
        const isCorrect = userAnswer === currentTask.answer;
        
        if (isCorrect) {
            let reward = 50 + getRewardBonus();
            totalCoins += reward;
            locationProgress[currentLocation].tasks[currentTaskIndex] = true;
            
            document.getElementById('feedback').className = 'feedback correct';
            document.getElementById('feedback').innerHTML = `✅ ПРАВИЛЬНО! +${reward} монет`;
            
            waitingForNext = true;
            errorCount = 0;
            
            const allTasksCompleted = locationProgress[currentLocation].tasks.every(t => t === true);
            if (allTasksCompleted) {
                locationProgress[currentLocation].completed = true;
                setTimeout(() => {
                    document.getElementById('taskScreen').classList.add('hidden');
                    document.getElementById('mapScreen').classList.remove('hidden');
                    updateMapUI();
                    
                    const allCompleted = locationProgress.every(p => p.completed);
                    if (allCompleted) {
                        showResult();
                    }
                }, 1500);
            } else {
                setTimeout(() => {
                    currentTaskIndex++;
                    loadTask();
                }, 1500);
            }
        } else {
            errorCount++;
            
            if (errorCount === 1) {
                document.getElementById('feedback').className = 'feedback wrong';
                document.getElementById('feedback').innerHTML = `❌ НЕПРАВИЛЬНО! Попробуйте ещё раз.`;
            } else if (errorCount === 2) {
                document.getElementById('feedback').className = 'feedback hint';
                document.getElementById('feedback').innerHTML = `❌ НЕПРАВИЛЬНО! Подсказка: ${currentTask.hint}`;
            } else if (errorCount >= 3) {
                if (shieldActive) {
                    shieldActive = false;
                    document.getElementById('feedback').className = 'feedback hint';
                    document.getElementById('feedback').innerHTML = `❌ НЕПРАВИЛЬНО! Броня защитила вас от потери жизни. Правильный ответ: ${currentTask.answer}`;
                    waitingForNext = true;
                    setTimeout(() => {
                        document.getElementById('taskScreen').classList.add('hidden');
                        document.getElementById('mapScreen').classList.remove('hidden');
                        updateMapUI();
                    }, 2000);
                } else {
                    lives--;
                    document.getElementById('taskLives').innerHTML = lives;
                    document.getElementById('feedback').className = 'feedback wrong';
                    document.getElementById('feedback').innerHTML = `❌ НЕПРАВИЛЬНО! Вы потеряли жизнь. Правильный ответ: ${currentTask.answer}`;
                    waitingForNext = true;
                    
                    if (lives <= 0) {
                        setTimeout(() => {
                            alert('Игра окончена! Начните заново.');
                            startGame();
                        }, 2000);
                    } else {
                        setTimeout(() => {
                            document.getElementById('taskScreen').classList.add('hidden');
                            document.getElementById('mapScreen').classList.remove('hidden');
                            updateMapUI();
                        }, 2000);
                    }
                }
            }
        }
    }
    
    function showResult() {
        document.getElementById('mapScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');
    }
    
    function openFinalChest() {
        if (finalChestOpened) return;
        finalChestOpened = true;
        
        const raritys = ['common', 'rare', 'epic', 'legendary'];
        const rarityNames = { common: 'Обычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный' };
        const items = {
            common: ['🍎 Яблоко', '🌿 Трава', '🪨 Камень', '🌵 Кактус'],
            rare: ['📖 Книга', '🔑 Ключ', '⚜️ Амулет', '🧪 Зелье'],
            epic: ['🗡️ Меч', '🛡️ Щит', '👑 Корона', '💍 Кольцо'],
            legendary: ['🐉 Дракон', '🌟 Звезда', '🏆 Кубок', '✨ Магия']
        };
        
        const randomRarity = raritys[Math.floor(Math.random() * raritys.length)];
        const idx = Math.floor(Math.random() * items[randomRarity].length);
        const accessory = items[randomRarity][idx];
        const emoji = accessory.split(' ')[0];
        
        accessories.push({ name: accessory, emoji: emoji, rarity: randomRarity });
        
        document.getElementById('chestResult').innerHTML = `<div style="background:#d4edda; padding:20px; border-radius:20px; margin-top:20px;">🎉 Вы получили: ${emoji} ${accessory} (${rarityNames[randomRarity]})! 🎉</div>`;
        document.getElementById('finalChest').style.opacity = '0.5';
        document.getElementById('finalChest').style.cursor = 'default';
    }
    
    function openShop() {
        document.getElementById('mapScreen').classList.add('hidden');
        document.getElementById('shopScreen').classList.remove('hidden');
        
        const container = document.getElementById('shopItems');
        container.innerHTML = '';
        
        const charsDiv = document.createElement('div');
        charsDiv.className = 'shop-category';
        charsDiv.innerHTML = '<h3>👥 ПЕРСОНАЖИ (дают бафы)</h3>';
        characters.forEach(char => {
            const isOwned = ownedCharacters.includes(char.name);
            const isActive = activeCharacter === char.name;
            const div = document.createElement('div');
            div.className = 'shop-item';
            if (isOwned) div.classList.add('owned');
            div.innerHTML = `
                <div style="font-size:2rem">${char.emoji}</div>
                <div>${char.name}</div>
                <div>${char.description}</div>
                <div>✨ Бонус: ${char.buff.desc}</div>
                <div class="item-price">💰 ${char.price} монет</div>
                ${isOwned ? (isActive ? '<div>✅ АКТИВЕН</div>' : '<div>🔘 ВЫБРАТЬ</div>') : ''}
            `;
            if (!isOwned) {
                div.onclick = () => {
                    if (totalCoins >= char.price) {
                        totalCoins -= char.price;
                        ownedCharacters.push(char.name);
                        openShop();
                        alert(`🎉 Вы купили персонажа ${char.name}!`);
                        updateMapUI();
                    } else {
                        alert(`❌ Не хватает монет! Нужно ${char.price}`);
                    }
                };
            } else if (!isActive) {
                div.onclick = () => {
                    activeCharacter = char.name;
                    openShop();
                    alert(`🎉 Вы выбрали персонажа ${char.name}!`);
                    updateMapUI();
                };
            }
            charsDiv.appendChild(div);
        });
        container.appendChild(charsDiv);
        
        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'shop-category';
        itemsDiv.innerHTML = '<h3>🎒 ПРЕДМЕТЫ</h3>';
        shopItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div style="font-size:2rem">${item.emoji}</div>
                <div>${item.name}</div>
                <div>${item.desc}</div>
                <div class="item-price">💰 ${item.price} монет</div>
            `;
            div.onclick = () => {
                if (item.effect === 'credit') {
                    totalCoins += 500;
                    debt += 600;
                    alert(`🏦 Вы взяли кредит 500 монет! Вернуть нужно 600.`);
                    openShop();
                    updateMapUI();
                } else if (item.effect === 'chest') {
                    if (totalCoins >= 10000) {
                        totalCoins -= 10000;
                        const raritys = ['common', 'rare', 'epic', 'legendary'];
                        const rarityNames = { common: 'Обычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный' };
                        const itemsMap = {
                            common: ['🍎 Яблоко', '🌿 Трава', '🪨 Камень', '🌵 Кактус'],
                            rare: ['📖 Книга', '🔑 Ключ', '⚜️ Амулет', '🧪 Зелье'],
                            epic: ['🗡️ Меч', '🛡️ Щит', '👑 Корона', '💍 Кольцо'],
                            legendary: ['🐉 Дракон', '🌟 Звезда', '🏆 Кубок', '✨ Магия']
                        };
                        const randomRarity = raritys[Math.floor(Math.random() * raritys.length)];
                        const idx = Math.floor(Math.random() * itemsMap[randomRarity].length);
                        const accessory = itemsMap[randomRarity][idx];
                        const emoji = accessory.split(' ')[0];
                        accessories.push({ name: accessory, emoji: emoji, rarity: randomRarity });
                        alert(`🎉 Вы получили: ${emoji} ${accessory} (${rarityNames[randomRarity]})!`);
                        openShop();
                        updateMapUI();
                    } else {
                        alert(`❌ Не хватает монет! Нужно 10000`);
                    }
                } else if (totalCoins >= item.price) {
                    totalCoins -= item.price;
                    if (item.effect === 'heart') lives++;
                    if (item.effect === 'shield') shieldActive = true;
                    openShop();
                    alert(`🎉 Вы купили ${item.name}!`);
                    updateMapUI();
                } else {
                    alert(`❌ Не хватает монет! Нужно ${item.price}`);
                }
            };
            itemsDiv.appendChild(div);
        });
        container.appendChild(itemsDiv);
    }
    
    function openShelf() {
        document.getElementById('mapScreen').classList.add('hidden');
        document.getElementById('shelfScreen').classList.remove('hidden');
        
        const grid = document.getElementById('accessoriesGrid');
        grid.innerHTML = '';
        
        accessories.forEach(acc => {
            const div = document.createElement('div');
            div.className = 'accessory-card';
            div.innerHTML = `
                <div class="accessory-emoji">${acc.emoji}</div>
                <div>${acc.name}</div>
                <div style="font-size:0.7rem; color:#666;">${acc.rarity}</div>
            `;
            grid.appendChild(div);
        });
        
        if (accessories.length === 0) {
            grid.innerHTML = '<p>У вас пока нет аксессуаров. Проходите квест и открывайте сундук в конце!</p>';
        }
    }
    
    function startGame() {
        resetAllProgress();
        updateMapUI();
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('mapScreen').classList.remove('hidden');
        document.getElementById('taskScreen').classList.add('hidden');
        document.getElementById('shopScreen').classList.add('hidden');
        document.getElementById('shelfScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
    }
    
    function exitToStart() {
        resetAllProgress();
        document.getElementById('startScreen').classList.remove('hidden');
        document.getElementById('mapScreen').classList.add('hidden');
        document.getElementById('taskScreen').classList.add('hidden');
        document.getElementById('shopScreen').classList.add('hidden');
        document.getElementById('shelfScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
    }
    
    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('backToMapBtn').onclick = () => {
        document.getElementById('taskScreen').classList.add('hidden');
        document.getElementById('mapScreen').classList.remove('hidden');
        updateMapUI();
    };
    document.getElementById('exitToStartBtn').onclick = exitToStart;
    document.getElementById('exitResultBtn').onclick = exitToStart;
    document.getElementById('playAgainBtn').onclick = startGame;
    document.getElementById('submitBtn').onclick = checkAnswer;
    document.getElementById('openShopBtn').onclick = openShop;
    document.getElementById('openShelfBtn').onclick = openShelf;
    document.getElementById('closeShopBtn').onclick = () => {
        document.getElementById('shopScreen').classList.add('hidden');
        document.getElementById('mapScreen').classList.remove('hidden');
        updateMapUI();
    };
    document.getElementById('closeShelfBtn').onclick = () => {
        document.getElementById('shelfScreen').classList.add('hidden');
        document.getElementById('mapScreen').classList.remove('hidden');
        updateMapUI();
    };
    document.getElementById('finalChest').onclick = openFinalChest;
    document.getElementById('answerInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
</body>
