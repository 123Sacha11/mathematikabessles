<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Линейная дуэль - Математика без слёз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .score-box {
            background: #667eea;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .difficulty-select {
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #667eea;
            background: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .clear-btn {
            padding: 10px 20px;
            background: #ffc107;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .canvas-area {
            flex: 2;
            min-width: 550px;
        }

        canvas {
            border: 2px solid #333;
            border-radius: 10px;
            background: #e8d0a0;
            cursor: crosshair;
            width: 100%;
            height: auto;
            display: block;
        }

        .task-area {
            flex: 1;
            min-width: 280px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 20px;
        }

        .task-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .input-area {
            margin: 20px 0;
        }

        .input-area input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .input-area button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .next-btn {
            flex: 1;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            display: none;
        }

        .skip-btn {
            flex: 1;
            padding: 12px;
            background: #ffc107;
            color: #333;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            display: none;
        }

        .giveup-btn {
            width: 100%;
            padding: 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            display: block;
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 15px 0;
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .feedback.hint {
            background: #fff3cd;
            color: #856404;
        }

        .task-type {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            text-align: center;
        }

        .status {
            text-align: center;
            padding: 10px;
            font-weight: bold;
            background: #e9ecef;
            border-radius: 10px;
            margin-top: 10px;
        }

        .draw-tools {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h2>🎯 Линейная дуэль</h2>
            <div class="score-box">
                👤 <span id="playerScore">0</span> : <span id="computerScore">0</span> 🤖
            </div>
            <select id="difficulty" class="difficulty-select">
                <option value="easy">😊 Простой</option>
                <option value="normal">😐 Средний</option>
                <option value="hard">😤 Сложный</option>
            </select>
            <button class="clear-btn" onclick="clearDrawing()">🗑️ Очистить следы</button>
        </div>

        <div class="game-area">
            <div class="canvas-area">
                <canvas id="planeCanvas" width="650" height="650"></canvas>
                <div class="status" id="status">🎯 Прицелься и выстрели!</div>
                <div class="draw-tools">
                    <span>✏️ Следы пуль (зажми левую кнопку)</span>
                </div>
            </div>
            <div class="task-area">
                <div class="timer" id="timerDisplay">--</div>
                <div class="task-text">
                    <span class="task-type" id="taskType">Задание 1/5</span>
                    <div id="taskDescription">Загрузка...</div>
                </div>
                <div class="input-area" id="inputArea">
                    <input type="text" id="answerInput" placeholder="Введите ответ (например: y=2x+1)">
                    <button id="submitBtn" onclick="submitAnswer()">💥 Выстрелить</button>
                </div>
                <div class="action-buttons">
                    <button id="nextButton" class="next-btn" onclick="nextTask()">➡️ Далее</button>
                    <button id="skipButton" class="skip-btn" onclick="skipTask()">⏭️ Пропустить</button>
                </div>
                <button id="giveupButton" class="giveup-btn" onclick="giveUp()">🏳️ Сдаться</button>
                <div id="feedback" class="feedback"></div>
                <div id="hintArea"></div>
            </div>
        </div>

        <a href="index.html" class="back-btn">← На главную</a>
    </div>

    <script>
        // ============ Игровые переменные ============
        let canvas = document.getElementById('planeCanvas');
        let ctx = canvas.getContext('2d');
        
        let playerScore = 0;
        let computerScore = 0;
        let difficulty = 'easy';
        let currentTaskIndex = 0;
        let currentTask = null;
        let timeLeft = 0;
        let timerInterval = null;
        let canAnswer = true;
        let attempts = 0;
        let gameActive = true;
        let waitingForNext = false;
        
        let clickedPoints = [];
        
        let drawing = false;
        let lastX = 0, lastY = 0;
        let drawings = [];
        
        let offsetX = 325, offsetY = 325;
        let scale = 32;
        
        let hitAnimation = null;
        
        // ============ Время на задания ============
        function getTimeForTask(taskType) {
            if (difficulty === 'easy') return null;
            if (difficulty === 'normal') return 20;
            switch(taskType) {
                case 0: return 12;
                case 1: return 15;
                case 2: return 18;
                case 3: return 20;
                case 4: return 22;
                default: return 18;
            }
        }
        
        function getHintEnabled() {
            return difficulty === 'easy';
        }
        
        // ============ Пустынная карта с колючками ============
        function drawSandDunes() {
            ctx.fillStyle = '#e8d0a0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < 800; i++) {
                ctx.fillStyle = `rgba(180, 140, 80, ${Math.random() * 0.4})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }
            
            ctx.fillStyle = 'rgba(200, 160, 100, 0.25)';
            for (let i = 0; i < 12; i++) {
                ctx.beginPath();
                ctx.ellipse(
                    50 + Math.random() * (canvas.width - 100),
                    canvas.height - 40 - Math.random() * 150,
                    90 + Math.random() * 120,
                    18 + Math.random() * 30,
                    0, 0, Math.PI * 2
                );
                ctx.fill();
            }
            
            for (let i = 0; i < 45; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                if (Math.abs(x - offsetX) < 100 && Math.abs(y - offsetY) < 100) continue;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(0.8 + Math.random() * 0.7, 0.8 + Math.random() * 0.7);
                
                ctx.fillStyle = '#5a7a3a';
                ctx.fillRect(-2, -15, 4, 20);
                
                ctx.beginPath();
                ctx.strokeStyle = '#7a9a4a';
                ctx.lineWidth = 1.5;
                for (let j = 0; j < 6; j++) {
                    const angle = (j / 6) * Math.PI * 2;
                    const x1 = Math.cos(angle) * 6;
                    const y1 = -10 + Math.sin(angle) * 4;
                    ctx.beginPath();
                    ctx.moveTo(0, -5);
                    ctx.lineTo(x1, y1);
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#8aba5a';
                ctx.beginPath();
                ctx.arc(0, -18, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            ctx.fillStyle = '#6a8a4a';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                if (Math.abs(x - offsetX) < 80 && Math.abs(y - offsetY) < 80) continue;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - 2, y - 5);
                ctx.lineTo(x + 2, y - 5);
                ctx.fill();
            }
            
            ctx.fillStyle = 'rgba(140, 100, 60, 0.35)';
            for (let i = 0; i < 300; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawGrid() {
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.shadowBlur = 3;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            
            for (let i = -12; i <= 12; i++) {
                const x = offsetX + i * scale;
                if (x >= 0 && x <= canvas.width) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
            }
            
            for (let i = -12; i <= 12; i++) {
                const y = offsetY + i * scale;
                if (y >= 0 && y <= canvas.height) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.moveTo(offsetX, 0);
            ctx.lineTo(offsetX, canvas.height);
            ctx.moveTo(0, offsetY);
            ctx.lineTo(canvas.width, offsetY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.strokeStyle = '#ffffaa';
            ctx.lineWidth = 1.5;
            ctx.moveTo(offsetX, 0);
            ctx.lineTo(offsetX, canvas.height);
            ctx.moveTo(0, offsetY);
            ctx.lineTo(canvas.width, offsetY);
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 2;
            ctx.beginPath();
            ctx.moveTo(offsetX - 5, 10);
            ctx.lineTo(offsetX, 0);
            ctx.lineTo(offsetX + 5, 10);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(canvas.width - 10, offsetY - 5);
            ctx.lineTo(canvas.width, offsetY);
            ctx.lineTo(canvas.width - 10, offsetY + 5);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px "Segoe UI", Arial';
            ctx.shadowBlur = 3;
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.fillText('0', offsetX + 5, offsetY - 8);
            
            for (let i = -10; i <= 10; i++) {
                if (i !== 0) {
                    if (offsetX + i * scale + 5 < canvas.width && offsetX + i * scale + 5 > 0) {
                        ctx.fillText(i, offsetX + i * scale + 5, offsetY - 8);
                    }
                    if (offsetY - i * scale + 5 > 0 && offsetY - i * scale + 5 < canvas.height) {
                        ctx.fillText(i, offsetX - 25, offsetY - i * scale + 5);
                    }
                }
            }
            
            ctx.shadowBlur = 0;
            ctx.restore();
        }
        
        function drawAllDrawings() {
            for (let d of drawings) {
                ctx.beginPath();
                ctx.strokeStyle = '#b87c3a';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.moveTo(d.x1, d.y1);
                ctx.lineTo(d.x2, d.y2);
                ctx.stroke();
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(184, 124, 58, 0.5)';
                ctx.lineWidth = 5;
                ctx.moveTo(d.x1, d.y1);
                ctx.lineTo(d.x2, d.y2);
                ctx.stroke();
            }
        }
        
        function drawHitAnimation() {
            if (hitAnimation) {
                const now = Date.now();
                if (now - hitAnimation.time < 500) {
                    const progress = (now - hitAnimation.time) / 500;
                    const radius = 15 + progress * 22;
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(220, 140, 50, ${0.8 - progress * 0.8})`;
                    ctx.arc(hitAnimation.x, hitAnimation.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(250, 200, 80, ${0.9 - progress * 0.9})`;
                    ctx.arc(hitAnimation.x, hitAnimation.y, radius * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    hitAnimation = null;
                }
            }
        }
        
        function drawClickedPoints() {
            if (clickedPoints.length > 0) {
                clickedPoints.forEach(p => {
                    const px = offsetX + p.x * scale;
                    const py = offsetY - p.y * scale;
                    ctx.beginPath();
                    ctx.fillStyle = '#b87c3a';
                    ctx.arc(px, py, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.fillStyle = '#e8b86a';
                    ctx.arc(px, py, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
                if (clickedPoints.length === 2) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#b87c3a';
                    ctx.lineWidth = 3;
                    const p1 = clickedPoints[0];
                    const p2 = clickedPoints[1];
                    ctx.moveTo(offsetX + p1.x * scale, offsetY - p1.y * scale);
                    ctx.lineTo(offsetX + p2.x * scale, offsetY - p2.y * scale);
                    ctx.stroke();
                }
            }
        }
        
        function redrawFull() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSandDunes();
            drawGrid();
            drawAllDrawings();
            drawClickedPoints();
            drawHitAnimation();
        }
        
        function animateHit(x, y) {
            hitAnimation = { x, y, time: Date.now() };
            redrawFull();
        }
        
        // ============ Генерация заданий ============
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }
        
        function getCoordRange() {
            if (difficulty === 'easy') return { min: -4, max: 4 };
            if (difficulty === 'normal') return { min: -6, max: 6 };
            return { min: -8, max: 8 };
        }
        
        function getFindPointTask() {
            const range = getCoordRange();
            const x = getRandomInt(range.min, range.max);
            const y = getRandomInt(range.min, range.max);
            return {
                type: 0,
                name: 'Найди точку',
                description: `🏜️ Цель: точка (${x}; ${y}). Выстрели!`,
                answer: { x, y },
                check: (clickX, clickY) => {
                    const tolerance = 20;
                    const pixelX = offsetX + clickX * scale;
                    const pixelY = offsetY - clickY * scale;
                    const targetPixelX = offsetX + x * scale;
                    const targetPixelY = offsetY - y * scale;
                    const dist = Math.hypot(pixelX - targetPixelX, pixelY - targetPixelY);
                    if (dist < tolerance) animateHit(targetPixelX, targetPixelY);
                    return dist < tolerance;
                }
            };
        }
        
        function getConnectPointsTask() {
            const range = getCoordRange();
            const p1 = { x: getRandomInt(range.min, range.max), y: getRandomInt(range.min, range.max) };
            const p2 = { x: getRandomInt(range.min, range.max), y: getRandomInt(range.min, range.max) };
            return {
                type: 1,
                name: 'Соедини две точки',
                description: `🎯 Порази две цели: (${p1.x}; ${p1.y}) и (${p2.x}; ${p2.y}) (соедини выстрелами)`,
                points: [p1, p2],
                check: (clicked) => {
                    if (clicked.length !== 2) return false;
                    return (clicked[0].x === p1.x && clicked[0].y === p1.y && clicked[1].x === p2.x && clicked[1].y === p2.y) ||
                           (clicked[0].x === p2.x && clicked[0].y === p2.y && clicked[1].x === p1.x && clicked[1].y === p1.y);
                }
            };
        }
        
        function getGraphAndCoordinateTask() {
            const k = getRandomInt(-2, 2);
            const b = getRandomInt(-3, 3);
            const giveX = Math.random() > 0.5;
            if (giveX) {
                const x = getRandomInt(-5, 5);
                const y = k * x + b;
                return {
                    type: 2,
                    name: 'График + часть координат',
                    description: `📐 Функция y = ${k}x + ${b}. Найди y при x = ${x}`,
                    answer: y.toString(),
                    formatAnswer: () => y.toString()
                };
            } else {
                const y = getRandomInt(-5, 5);
                if (k === 0) return getGraphAndCoordinateTask();
                const x = (y - b) / k;
                if (Math.abs(x) > 10) return getGraphAndCoordinateTask();
                return {
                    type: 2,
                    name: 'График + часть координат',
                    description: `📐 Функция y = ${k}x + ${b}. Найди x при y = ${y}`,
                    answer: x.toString(),
                    formatAnswer: () => x.toString()
                };
            }
        }
        
        function getTwoPointsToFormulaTask() {
            const range = getCoordRange();
            const x1 = getRandomInt(range.min, range.max);
            const y1 = getRandomInt(range.min, range.max);
            let x2, y2;
            do {
                x2 = getRandomInt(range.min, range.max);
                y2 = getRandomInt(range.min, range.max);
            } while (x2 === x1);
            const k = (y2 - y1) / (x2 - x1);
            const b = y1 - k * x1;
            return {
                type: 3,
                name: 'Две точки → формула',
                description: `🏹 Две цели: (${x1}; ${y1}) и (${x2}; ${y2}). Найди формулу линии прицела!`,
                answer: { k, b },
                formatAnswer: () => formatFormula(k, b),
                checkFormula: (userK, userB) => Math.abs(userK - k) < 0.1 && Math.abs(userB - b) < 0.1
            };
        }
        
        function getPointWithHintTask() {
            const range = getCoordRange();
            const x = getRandomInt(range.min, range.max);
            const y = getRandomInt(range.min, range.max);
            const hintType = Math.floor(Math.random() * 2);
            let k, hint;
            if (hintType === 0) {
                k = getRandomInt(-2, 2);
                hint = `параллельна прямой y = ${k}x + ${getRandomInt(-3, 3)}`;
            } else {
                hint = `проходит через начало координат`;
                k = getRandomInt(-2, 2);
            }
            const b = hintType === 1 ? 0 : y - k * x;
            return {
                type: 4,
                name: 'Точка + подсказка',
                description: `🎯 Цель (${x}; ${y}). Линия прицела ${hint}. Найди формулу!`,
                answer: { k, b },
                formatAnswer: () => formatFormula(k, b),
                checkFormula: (userK, userB) => Math.abs(userK - k) < 0.1 && Math.abs(userB - b) < 0.1
            };
        }
        
        function formatFormula(k, b) {
            let kStr = k === Math.floor(k) ? k : k.toFixed(1);
            let bStr = Math.abs(b) === Math.floor(Math.abs(b)) ? Math.abs(b) : Math.abs(b).toFixed(1);
            if (b >= 0) return `y = ${kStr}x + ${bStr}`;
            return `y = ${kStr}x - ${bStr}`;
        }
        
        const taskGenerators = [getFindPointTask, getConnectPointsTask, getGraphAndCoordinateTask, getTwoPointsToFormulaTask, getPointWithHintTask];
        
        // ============ Функции завершения задания ============
        function showButtons(isCorrect) {
            const nextBtn = document.getElementById('nextButton');
            const skipBtn = document.getElementById('skipButton');
            const submitBtn = document.getElementById('submitBtn');
            const giveupBtn = document.getElementById('giveupButton');
            
            if (isCorrect) {
                nextBtn.style.display = 'block';
                skipBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'none';
                skipBtn.style.display = 'block';
            }
            
            submitBtn.style.display = 'none';
            giveupBtn.style.display = 'none';
        }
        
        function hideButtons() {
            const nextBtn = document.getElementById('nextButton');
            const skipBtn = document.getElementById('skipButton');
            const submitBtn = document.getElementById('submitBtn');
            const giveupBtn = document.getElementById('giveupButton');
            nextBtn.style.display = 'none';
            skipBtn.style.display = 'none';
            submitBtn.style.display = 'block';
            giveupBtn.style.display = 'block';
        }
        
        function completeTask(isCorrect, correctAnswer) {
            if (waitingForNext) return;
            
            canAnswer = false;
            waitingForNext = true;
            
            if (timerInterval) clearInterval(timerInterval);
            
            if (isCorrect) {
                document.getElementById('feedback').className = 'feedback correct';
                document.getElementById('feedback').innerHTML = '💥 Попадание! +1 очко 💥';
                playerScore++;
            } else {
                document.getElementById('feedback').className = 'feedback wrong';
                document.getElementById('feedback').innerHTML = `❌ Промах! Правильный ответ: ${correctAnswer}`;
                computerScore++;
            }
            
            updateScore();
            showButtons(isCorrect);
        }
        
        function giveUp() {
            if (!canAnswer || waitingForNext) return;
            
            canAnswer = false;
            waitingForNext = true;
            
            if (timerInterval) clearInterval(timerInterval);
            
            const correct = currentTask.formatAnswer ? currentTask.formatAnswer() : `(${currentTask.answer.x}; ${currentTask.answer.y})`;
            document.getElementById('feedback').className = 'feedback wrong';
            document.getElementById('feedback').innerHTML = `🏳️ Сдаётся! Правильный ответ: ${correct}`;
            computerScore++;
            updateScore();
            
            showButtons(false);
        }
        
        function skipTask() {
            if (!waitingForNext) return;
            nextTask();
        }
        
        function nextTask() {
            hideButtons();
            waitingForNext = false;
            loadNextTask();
        }
        
        function loadNextTask() {
            if (!gameActive) return;
            if (waitingForNext) return;
            
            canAnswer = true;
            clickedPoints = [];
            attempts = 0;
            
            if (playerScore >= 5) { endGame(true); return; }
            if (computerScore >= 5) { endGame(false); return; }
            
            let taskNum = currentTaskIndex % 5;
            currentTask = taskGenerators[taskNum]();
            currentTaskIndex++;
            
            document.getElementById('taskType').innerHTML = `${currentTask.name} (${currentTaskIndex}/5)`;
            document.getElementById('taskDescription').innerHTML = currentTask.description;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('hintArea').innerHTML = '';
            
            const timeLimit = getTimeForTask(currentTask.type);
            if (timeLimit) {
                timeLeft = timeLimit;
                document.getElementById('timerDisplay').innerHTML = `⏱️ ${timeLeft} сек`;
                startTimer();
            } else {
                document.getElementById('timerDisplay').innerHTML = '⏱️ Без таймера';
            }
            
            redrawFull();
            
            if (currentTask.type === 0) {
                document.getElementById('status').innerHTML = '🎯 Прицелься и кликни по цели в пустыне! 🎯';
                document.getElementById('inputArea').style.display = 'none';
            } else if (currentTask.type === 1) {
                document.getElementById('status').innerHTML = '🔫 Порази две цели выстрелами в пустыне! 🔫';
                document.getElementById('inputArea').style.display = 'none';
            } else {
                document.getElementById('status').innerHTML = '✏️ Введи формулу в прицел';
                document.getElementById('inputArea').style.display = 'block';
            }
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0 && gameActive && canAnswer && !waitingForNext) {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerHTML = `⏱️ ${timeLeft} сек`;
                    if (timeLeft === 0) {
                        clearInterval(timerInterval);
                        if (canAnswer && !waitingForNext) {
                            const correct = currentTask.formatAnswer ? currentTask.formatAnswer() : `(${currentTask.answer.x}; ${currentTask.answer.y})`;
                            completeTask(false, correct);
                        }
                    }
                }
            }, 1000);
        }
        
        function submitAnswer() {
            if (!canAnswer || !gameActive || waitingForNext) return;
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase().replace(/\s/g, '');
            
            let isCorrect = false;
            
            if (currentTask.type === 2) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(currentTask.answer)) < 0.1;
            } else if (currentTask.type === 3 || currentTask.type === 4) {
                const match = userAnswer.match(/y\s*=\s*(-?\d+\.?\d*)\s*x\s*([+-]\s*\d+\.?\d*)?/);
                if (match) {
                    let userK = parseFloat(match[1]);
                    let userB = match[2] ? parseFloat(match[2].replace(/\s/g, '')) : 0;
                    if (isNaN(userK)) userK = parseFloat(match[1].replace('y=', ''));
                    isCorrect = currentTask.checkFormula(userK, userB);
                }
            }
            
            if (isCorrect) {
                completeTask(true, null);
            } else {
                if (getHintEnabled() && attempts < 1) {
                    attempts++;
                    document.getElementById('feedback').className = 'feedback hint';
                    document.getElementById('feedback').innerHTML = `❌ Промах! Попробуй ещё раз!`;
                    showHint();
                    return;
                }
                const correct = currentTask.formatAnswer ? currentTask.formatAnswer() : `(${currentTask.answer.x}; ${currentTask.answer.y})`;
                completeTask(false, correct);
            }
        }
        
        function showHint() {
            let hint = '';
            if (currentTask.type === 2) hint = '💡 Подставь известное значение в формулу.';
            else if (currentTask.type === 3) hint = '💡 Сначала найди k = (y₂ - y₁)/(x₂ - x₁), затем b = y - kx.';
            else if (currentTask.type === 4) hint = '💡 Если параллельна — k такой же. Если через начало координат — b = 0.';
            document.getElementById('hintArea').innerHTML = `<div class="feedback hint">${hint}</div>`;
        }
        
        function updateScore() {
            document.getElementById('playerScore').innerHTML = playerScore;
            document.getElementById('computerScore').innerHTML = computerScore;
        }
        
        function endGame(isWin) {
            gameActive = false;
            if (timerInterval) clearInterval(timerInterval);
            const message = isWin ? '🏆 Победа! Ты лучший снайпер пустыни!' : '😔 Поражение! Противник оказался точнее...';
            alert(message + `\nСчёт: ${playerScore} : ${computerScore}`);
            resetGame();
        }
        
        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            currentTaskIndex = 0;
            attempts = 0;
            gameActive = true;
            waitingForNext = false;
            drawings = [];
            updateScore();
            hideButtons();
            loadNextTask();
        }
        
        function clearDrawing() {
            drawings = [];
            redrawFull();
        }
        
        // ============ Рисование мышкой и клики ============
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            const worldX = (mouseX - offsetX) / scale;
            const worldY = (offsetY - mouseY) / scale;
            return { x: worldX, y: worldY, px: mouseX, py: mouseY };
        }
        
        function startDrawing(e) {
            drawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.px;
            lastY = coords.py;
        }
        
        function draw(e) {
            if (!drawing) return;
            const coords = getCanvasCoords(e);
            drawings.push({
                x1: lastX,
                y1: lastY,
                x2: coords.px,
                y2: coords.py
            });
            ctx.beginPath();
            ctx.strokeStyle = '#b87c3a';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.px, coords.py);
            ctx.stroke();
            lastX = coords.px;
            lastY = coords.py;
        }
        
        function stopDrawing() {
            drawing = false;
        }
        
        function handleCanvasClick(e) {
            if (!gameActive || !canAnswer || waitingForNext) return;
            const coords = getCanvasCoords(e);
            const worldX = Math.round(coords.x * 2) / 2;
            const worldY = Math.round(coords.y * 2) / 2;
            
            if (currentTask?.type === 0) {
                if (currentTask.check(worldX, worldY)) {
                    completeTask(true, null);
                } else {
                    if (getHintEnabled()) {
                        document.getElementById('feedback').className = 'feedback hint';
                        document.getElementById('feedback').innerHTML = `❌ Промах! Нужно попасть в (${currentTask.answer.x}; ${currentTask.answer.y})`;
                        return;
                    }
                    const correct = `(${currentTask.answer.x}; ${currentTask.answer.y})`;
                    completeTask(false, correct);
                }
            } 
            else if (currentTask?.type === 1) {
                clickedPoints.push({ x: worldX, y: worldY });
                redrawFull();
                
                if (clickedPoints.length === 2) {
                    if (currentTask.check(clickedPoints)) {
                        completeTask(true, null);
                        clickedPoints = [];
                        redrawFull();
                    } else {
                        if (getHintEnabled()) {
                            document.getElementById('feedback').className = 'feedback hint';
                            document.getElementById('feedback').innerHTML = `❌ Промах! Нужно поразить (${currentTask.points[0].x}; ${currentTask.points[0].y}) и (${currentTask.points[1].x}; ${currentTask.points[1].y})`;
                            setTimeout(() => {
                                clickedPoints = [];
                                redrawFull();
                            }, 1500);
                            return;
                        }
                        const correct = `(${currentTask.points[0].x}; ${currentTask.points[0].y}) и (${currentTask.points[1].x}; ${currentTask.points[1].y})`;
                        completeTask(false, correct);
                        clickedPoints = [];
                        redrawFull();
                    }
                } else {
                    document.getElementById('feedback').className = 'feedback hint';
                    document.getElementById('feedback').innerHTML = `💥 Выстрел по (${worldX}; ${worldY}). Жди второго выстрела!`;
                }
            }
        }
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('click', handleCanvasClick);
        
        document.getElementById('difficulty').addEventListener('change', (e) => {
            difficulty = e.target.value;
            resetGame();
        });
        
        resetGame();
    </script>
</body>
