<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Битва за аттестат - Математика без слёз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            width: 1100px;
            max-width: 100%;
            background: #0f0f23;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #ffaa44;
        }
        .screen {
            padding: 25px;
            min-height: 650px;
            display: flex;
            flex-direction: column;
        }
        .hidden { display: none; }
        
        .start-screen {
            text-align: center;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 100%);
            color: #ffaa44;
            justify-content: center;
            align-items: center;
        }
        .start-screen h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 10px #ffaa44; }
        .start-screen p { color: #ddd; margin-bottom: 30px; }
        .yashcher-avatar {
            font-size: 5rem;
            margin: 20px;
            background: #2a2a4a;
            border-radius: 50%;
            padding: 20px;
            display: inline-block;
        }
        button {
            background: #ffaa44;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: transform 0.2s;
            color: #1a1a3a;
        }
        button:hover { transform: scale(1.03); }
        
        .game-screen { background: #0f0f23; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a3a;
            border-radius: 20px;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #ffaa44;
        }
        .score-box {
            background: #0f0f23;
            color: #ffaa44;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: 1px solid #ffaa44;
        }
        .task-number {
            background: #2a2a4a;
            color: #ffaa44;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
        }
        .shop-btn {
            background: #28a745;
            color: white;
        }
        .mode-select, .difficulty-select {
            padding: 8px 15px;
            font-size: 1rem;
            border-radius: 20px;
            border: 2px solid #ffaa44;
            background: #1a1a3a;
            color: #ffaa44;
            cursor: pointer;
            font-weight: bold;
        }
        .exit-main-btn {
            background: #6c757d;
            color: white;
        }
        
        .battle-area {
            background: #1a1a3a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ffaa44;
        }
        .yashcher-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #0f0f23;
            border-radius: 15px;
        }
        .yashcher {
            text-align: center;
        }
        .yashcher-emoji { font-size: 4rem; }
        .yashcher-name { color: #ffaa44; font-weight: bold; font-size: 1.1rem; }
        .yashcher-lives { color: #ff6666; font-size: 1rem; margin-top: 5px; }
        
        .inventory {
            display: flex;
            gap: 15px;
            background: #1a1a3a;
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .item-icon {
            background: #2a2a4a;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #ffaa44;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            color: white;
            font-weight: bold;
        }
        .item-icon:hover {
            transform: scale(1.05);
            background: #ffaa44;
            color: #1a1a3a;
        }
        
        .task-panel {
            background: #0f0f23;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .task-text {
            font-size: 1.3rem;
            color: white;
            font-family: monospace;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .answer-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .answer-input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 25px;
            border: 2px solid #ffaa44;
            background: #0f0f23;
            color: white;
            width: 250px;
        }
        .answer-input::placeholder { color: #888; }
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
        }
        .feedback.correct { background: #1a3a1a; color: #88ff88; border: 1px solid #88ff88; }
        .feedback.wrong { background: #3a1a1a; color: #ff8888; border: 1px solid #ff8888; }
        .next-btn { background: #28a745; margin-top: 15px; width: 100%; color: white; font-size: 1.2rem; }
        
        .players-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .player-card {
            background: #1a1a3a;
            border-radius: 15px;
            padding: 12px;
            flex: 1;
            text-align: center;
            border: 1px solid #ffaa44;
        }
        .player-card.active {
            border: 2px solid #88ff88;
            background: #1a3a1a;
            box-shadow: 0 0 10px rgba(136,255,136,0.3);
        }
        .player-name { font-weight: bold; color: #ffaa44; font-size: 1.1rem; }
        .player-score { color: #ddd; font-size: 1rem; margin-top: 5px; }
        .player-lives { color: #ff8888; font-size: 0.9rem; margin-top: 5px; }
        
        .shop-screen {
            background: #0f0f23;
            text-align: center;
        }
        .shop-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .shop-item {
            background: #1a1a3a;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #ffaa44;
            text-align: center;
        }
        .shop-item:hover { transform: scale(1.02); background: #2a2a4a; }
        .shop-item-emoji { font-size: 3rem; }
        .shop-item-name { font-size: 1.5rem; font-weight: bold; margin: 10px 0; color: #ffaa44; }
        .shop-item-price { font-size: 1.2rem; color: #88ff88; font-weight: bold; margin: 10px 0; }
        .shop-item-desc { color: #ccc; font-size: 0.9rem; }
        
        .result-screen {
            text-align: center;
            justify-content: center;
            align-items: center;
            background: #0f0f23;
        }
        .final-score { font-size: 1.8rem; color: #ffaa44; margin: 20px 0; background: #1a1a3a; padding: 20px; border-radius: 20px; }
        .rating { font-size: 1.5rem; margin: 20px 0; color: #ffaa44; }
        .rating-text { color: #ddd; font-size: 1.1rem; }
        .round-result {
            margin-top: 15px;
            padding: 12px;
            background: #2a2a4a;
            border-radius: 15px;
            text-align: center;
            color: #ffaa44;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Стартовый экран -->
    <div id="startScreen" class="screen start-screen">
        <div class="yashcher-avatar">🐊👨‍🏫</div>
        <h1>⚔️ БИТВА ЗА АТТЕСТАТ ⚔️</h1>
        <p>Сразись с Ящером Иванко Вальеревичем и сдай ЕГЭ!</p>
        <button id="startGameBtn">🎓 НАЧАТЬ БИТВУ</button>
    </div>

    <!-- Основная игра -->
    <div id="gameScreen" class="screen hidden game-screen">
        <div class="top-bar">
            <div class="score-box">💰 МОНЕТЫ: <span id="score">0</span></div>
            <div class="task-number">📌 ЗАДАНИЕ №<span id="taskNum">1</span>/12</div>
            <div>
                <select id="modeSelect" class="mode-select">
                    <option value="solo">⚔️ ОДИНОЧНЫЙ</option>
                    <option value="royal">👑 КОРОЛЕВСКАЯ БИТВА</option>
                    <option value="endless">♾️ БЕСКОНЕЧНЫЙ</option>
                </select>
                <select id="difficultySelect" class="difficulty-select">
                    <option value="base">📚 БАЗА (7-8 класс, 10 монет)</option>
                    <option value="profile">📈 ПРОФИЛЬ (ЕГЭ, 50 монет)</option>
                </select>
                <button id="shopBtn" class="shop-btn">🛍️ МАГАЗИН</button>
                <button id="exitMainBtn" class="exit-main-btn">🏠 ВЫХОД</button>
            </div>
        </div>

        <div id="playersPanel" class="players-panel"></div>

        <div class="inventory" id="inventory"></div>

        <div class="battle-area">
            <div class="yashcher-panel">
                <div class="yashcher">
                    <div class="yashcher-emoji">🐊👨‍🏫</div>
                    <div class="yashcher-name">Ящер Иванко Вальеревич</div>
                    <div class="yashcher-lives">❤️ <span id="yashcherLives">3</span></div>
                </div>
                <div class="score-box">🎯 СЧЁТ ЯЩЕРА: <span id="yashcherScore">0</span></div>
            </div>

            <div class="task-panel">
                <div class="task-text" id="taskText">Загрузка...</div>
            </div>

            <div class="answer-area">
                <input type="text" id="answerInput" class="answer-input" placeholder="Введите ответ">
                <button id="submitBtn">🎯 ОТВЕТИТЬ</button>
            </div>
            <div id="feedback" class="feedback"></div>
            <button id="nextBtn" class="next-btn" style="display: none;">➡️ ДАЛЕЕ</button>
        </div>
        <div class="round-result" id="roundResult"></div>
    </div>

    <div id="shopScreen" class="screen hidden">
        <h2 style="color:#ffaa44;">🛍️ МАГАЗИН 🛍️</h2>
        <p style="font-size:1.3rem; color:#ddd;">💰 МОНЕТЫ: <span id="shopCoins" style="color:#88ff88;">0</span></p>
        <div class="shop-items" id="shopItems"></div>
        <button id="closeShopBtn">🔙 ВЕРНУТЬСЯ</button>
    </div>

    <div id="resultScreen" class="screen hidden">
        <h2 style="color:#ffaa44;">🏆 ИТОГИ 🏆</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="rating" id="rating">⭐⭐⭐</div>
        <div class="rating-text" id="ratingText"></div>
        <button id="restartBtn">🔄 НОВАЯ ИГРА</button>
        <button id="exitBtn" style="background: #6c757d;">🚪 ВЫХОД</button>
    </div>
</div>

<script>
    let mode = 'solo';
    let difficulty = 'base';
    let currentTaskIndex = 0;
    let playerCoins = 100;
    let yashcherLives = 3;
    let playerLives = 3;
    let waitingForNext = false;
    let currentTask = null;
    let shieldActive = false;
    
    let royalPlayers = [
        { name: "ВЫ", emoji: "👤", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
        { name: "Анна", emoji: "👩‍🎓", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
        { name: "Профилич", emoji: "👨‍🏫", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
        { name: "Ящер", emoji: "🐊", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 }
    ];
    let currentRoyalPlayer = 0;
    
    let inventory = { spurs: 0, shield: 0, medkit: 0, sword: 0, poison: 0, chest: 0, exam100: 0, victory: 0 };
    
    const shopItems = [
        { id: 'spurs', name: '📖 ШПОРА', price: 50, desc: 'Подсказка к заданию', effect: 'spurs', emoji: '📖' },
        { id: 'shield', name: '🛡️ ЩИТ', price: 80, desc: 'Неуязвимость на 1 раунд', effect: 'shield', emoji: '🛡️' },
        { id: 'medkit', name: '💊 АПТЕЧКА', price: 60, desc: 'Восстанавливает 1 жизнь', effect: 'medkit', emoji: '💊' },
        { id: 'sword', name: '⚔️ МЕЧ', price: 100, desc: 'Забирает 1 жизнь у Ящера', effect: 'sword', emoji: '⚔️' },
        { id: 'poison', name: '☠️ ЯД', price: 120, desc: '-1 жизнь, +50 монет', effect: 'poison', emoji: '☠️' },
        { id: 'chest', name: '🎁 ЯЩИК', price: 90, desc: 'Случайный предмет', effect: 'chest', emoji: '🎁' },
        { id: 'exam100', name: '🎓 100 БАЛЛОВ', price: 200, desc: '+100 монет', effect: 'exam100', emoji: '🎓' },
        { id: 'victory', name: '🏆 АТТЕСТАТ', price: 500, desc: 'Мгновенная победа', effect: 'victory', emoji: '🏆' }
    ];
    
    // БАЗА - задания 7-8 класса
    const baseTasks = [
        { num: 1, text: "2x + 3 = 11, x = ?", answer: "4", decimal: 4, hint: "2x = 8" },
        { num: 2, text: "3x - 5 = 10, x = ?", answer: "5", decimal: 5, hint: "3x = 15" },
        { num: 3, text: "x/4 + 2 = 5, x = ?", answer: "12", decimal: 12, hint: "x/4 = 3" },
        { num: 4, text: "5(x - 2) = 15, x = ?", answer: "5", decimal: 5, hint: "x-2 = 3" },
        { num: 5, text: "x² = 49, x > 0, x = ?", answer: "7", decimal: 7, hint: "√49 = 7" },
        { num: 6, text: "√x = 6, x = ?", answer: "36", decimal: 36, hint: "6² = 36" },
        { num: 7, text: "3^(x) = 27, x = ?", answer: "3", decimal: 3, hint: "3³ = 27" },
        { num: 8, text: "2^(x+1) = 16, x = ?", answer: "3", decimal: 3, hint: "2⁴ = 16, x+1=4" },
        { num: 9, text: "log₂ 8 = ?", answer: "3", decimal: 3, hint: "2³ = 8" },
        { num: 10, text: "log₃ 9 = ?", answer: "2", decimal: 2, hint: "3² = 9" },
        { num: 11, text: "Сколько процентов от 50 составляет 10?", answer: "20", decimal: 20, hint: "(10/50)×100 = 20%" },
        { num: 12, text: "Площадь прямоугольника 24 см², ширина 4 см. Длина = ?", answer: "6", decimal: 6, hint: "24 ÷ 4 = 6" },
        { num: 13, text: "Скорость 60 км/ч. Сколько км за 2.5 часа?", answer: "150", decimal: 150, hint: "60 × 2.5 = 150" },
        { num: 14, text: "|-7| + |3| = ?", answer: "10", decimal: 10, hint: "7 + 3 = 10" },
        { num: 15, text: "(-3)² = ?", answer: "9", decimal: 9, hint: "(-3)×(-3)=9" },
        { num: 16, text: "2/3 + 1/6 = ? (в виде дроби)", answer: "5/6", decimal: 0.8333, hint: "4/6+1/6=5/6" },
        { num: 17, text: "0.75 в виде обыкновенной дроби?", answer: "3/4", decimal: 0.75, hint: "0.75 = 75/100 = 3/4" },
        { num: 18, text: "Периметр квадрата 20 см. Сторона = ?", answer: "5", decimal: 5, hint: "20 ÷ 4 = 5" },
        { num: 19, text: "Среднее арифметическое чисел 4, 6, 8?", answer: "6", decimal: 6, hint: "(4+6+8)/3 = 6" },
        { num: 20, text: "10% от 250 = ?", answer: "25", decimal: 25, hint: "250 × 0.1 = 25" }
    ];
    
    // ПРОФИЛЬ - реальные задания ЕГЭ
    const profileTasks = [
        { num: 1, text: "log₂(x+3) = 3, x = ?", answer: "5", decimal: 5, hint: "x+3 = 8" },
        { num: 2, text: "√(2x+1) = 5, x = ?", answer: "12", decimal: 12, hint: "2x+1 = 25" },
        { num: 3, text: "3^(x+2) = 27, x = ?", answer: "1", decimal: 1, hint: "x+2 = 3" },
        { num: 4, text: "sin x = 0.5, x в градусах (0°-90°)", answer: "30", decimal: 30, hint: "sin 30° = 0.5" },
        { num: 5, text: "cos x = 0.5, x в градусах (0°-90°)", answer: "60", decimal: 60, hint: "cos 60° = 0.5" },
        { num: 6, text: "log₅(2x+1) = 2, x = ?", answer: "12", decimal: 12, hint: "2x+1 = 25" },
        { num: 7, text: "4^(x-1) = 64, x = ?", answer: "4", decimal: 4, hint: "4^(x-1) = 4³" },
        { num: 8, text: "lg(x-1) = 2, x = ?", answer: "101", decimal: 101, hint: "x-1 = 100" },
        { num: 9, text: "tg x = 1, x в градусах (0°-90°)", answer: "45", decimal: 45, hint: "tg 45° = 1" },
        { num: 10, text: "sin²x + cos²x = ?", answer: "1", decimal: 1, hint: "Основное тригонометрическое тождество" },
        { num: 11, text: "2^(2x-1) = 32, x = ?", answer: "3", decimal: 3, hint: "2x-1 = 5" },
        { num: 12, text: "log₂(x²-3x) = 2, x > 3, x = ?", answer: "4", decimal: 4, hint: "x²-3x = 4, x=4" },
        { num: 13, text: "sin 30° + cos 60° = ?", answer: "1", decimal: 1, hint: "0.5 + 0.5 = 1" },
        { num: 14, text: "log₃ 81 = ?", answer: "4", decimal: 4, hint: "3⁴ = 81" },
        { num: 15, text: "√(x+5) = 4, x = ?", answer: "11", decimal: 11, hint: "x+5 = 16" },
        { num: 16, text: "5^(x-2) = 125, x = ?", answer: "5", decimal: 5, hint: "5^(x-2) = 5³" },
        { num: 17, text: "log₇(3x-2) = 1, x = ?", answer: "3", decimal: 3, hint: "3x-2 = 7" },
        { num: 18, text: "cos 120° = ?", answer: "-0.5", decimal: -0.5, hint: "cos 120° = -cos 60° = -0.5" },
        { num: 19, text: "sin 150° = ?", answer: "0.5", decimal: 0.5, hint: "sin 150° = sin 30° = 0.5" },
        { num: 20, text: "log₂ 16 - log₂ 4 = ?", answer: "2", decimal: 2, hint: "4 - 2 = 2" }
    ];
    
    function getTasks() { return difficulty === 'base' ? baseTasks : profileTasks; }
    function getPoints() { return difficulty === 'base' ? 10 : 50; }
    
    function getRandomTaskForPlayer() {
        const tasks = getTasks();
        const randomIndex = Math.floor(Math.random() * tasks.length);
        return { ...tasks[randomIndex] };
    }
    
    function updateRoyalUI() {
        const panel = document.getElementById('playersPanel');
        panel.innerHTML = '';
        for (let i = 0; i < royalPlayers.length; i++) {
            const p = royalPlayers[i];
            const card = document.createElement('div');
            card.className = 'player-card';
            if (mode === 'royal' && i === currentRoyalPlayer && p.active) card.classList.add('active');
            card.innerHTML = `<div class="player-name">${p.emoji} ${p.name}</div>
                             <div class="player-score">${p.score} очков</div>
                             <div class="player-lives">❤️ ${p.lives}</div>`;
            panel.appendChild(card);
        }
    }
    
    function updateInventoryDisplay() {
        const container = document.getElementById('inventory');
        container.innerHTML = '';
        const items = [
            { id: 'spurs', emoji: '📖', name: 'Шпора', count: inventory.spurs },
            { id: 'shield', emoji: '🛡️', name: 'Щит', count: inventory.shield },
            { id: 'medkit', emoji: '💊', name: 'Аптечка', count: inventory.medkit },
            { id: 'sword', emoji: '⚔️', name: 'Меч', count: inventory.sword },
            { id: 'poison', emoji: '☠️', name: 'Яд', count: inventory.poison },
            { id: 'chest', emoji: '🎁', name: 'Ящик', count: inventory.chest },
            { id: 'exam100', emoji: '🎓', name: '100 баллов', count: inventory.exam100 },
            { id: 'victory', emoji: '🏆', name: 'Аттестат', count: inventory.victory }
        ];
        items.forEach(item => {
            if (item.count > 0) {
                const div = document.createElement('div');
                div.className = 'item-icon';
                div.innerHTML = `${item.emoji} ${item.name} x${item.count}`;
                div.onclick = () => useItem(item.id);
                container.appendChild(div);
            }
        });
    }
    
    function useItem(itemId) {
        if (mode !== 'solo' && currentRoyalPlayer !== 0) { alert('Сейчас ход другого игрока!'); return; }
        switch(itemId) {
            case 'spurs': if (inventory.spurs > 0 && currentTask) { inventory.spurs--; alert(`📖 Подсказка: ${currentTask.hint}`); updateInventoryDisplay(); } break;
            case 'shield': if (inventory.shield > 0) { inventory.shield--; shieldActive = true; alert(`🛡️ Щит активирован!`); updateInventoryDisplay(); } break;
            case 'medkit': 
                if (inventory.medkit > 0) { 
                    inventory.medkit--; 
                    if (mode === 'solo') { playerLives = Math.min(3, playerLives + 1); alert(`💊 +1 жизнь! Жизней: ${playerLives}`); } 
                    else if (mode === 'royal' && currentRoyalPlayer === 0) { 
                        let currentPlayerObj = royalPlayers[currentRoyalPlayer];
                        currentPlayerObj.lives = Math.min(3, currentPlayerObj.lives + 1);
                        alert(`💊 +1 жизнь! Жизней: ${currentPlayerObj.lives}`);
                        updateRoyalUI();
                    }
                    updateInventoryDisplay(); 
                } break;
            case 'sword': if (inventory.sword > 0 && yashcherLives > 0) { inventory.sword--; yashcherLives--; document.getElementById('yashcherLives').innerHTML = yashcherLives; alert(`⚔️ Ящер потерял жизнь! Осталось: ${yashcherLives}`); updateInventoryDisplay(); if (yashcherLives <= 0) endGame(true); } break;
            case 'poison': if (inventory.poison > 0 && playerLives > 1) { inventory.poison--; playerLives--; playerCoins += 50; alert(`☠️ -1 жизнь, +50 монет! Жизней: ${playerLives}`); updateInventoryDisplay(); } break;
            case 'chest': if (inventory.chest > 0) { inventory.chest--; const rand = shopItems[Math.floor(Math.random() * shopItems.length)]; inventory[rand.effect]++; alert(`🎁 Вы получили: ${rand.name}!`); updateInventoryDisplay(); } break;
            case 'exam100': if (inventory.exam100 > 0) { inventory.exam100--; playerCoins += 100; alert(`🎓 +100 монет!`); updateInventoryDisplay(); } break;
            case 'victory': if (inventory.victory > 0) { alert(`🏆 ПОБЕДА!`); endGame(true); } break;
        }
        document.getElementById('score').innerHTML = playerCoins;
    }
    
    function loadTask() {
        waitingForNext = false;
        const points = getPoints();
        
        if (mode === 'solo') {
            const tasks = getTasks();
            currentTask = tasks[currentTaskIndex % tasks.length];
            document.getElementById('taskNum').innerHTML = currentTask.num;
            document.getElementById('taskText').innerHTML = currentTask.text;
            document.getElementById('roundResult').innerHTML = `📝 Задание ${currentTaskIndex+1}/${tasks.length} | +${points} монет`;
        } 
        else if (mode === 'royal') {
            const currentPlayer = royalPlayers[currentRoyalPlayer];
            if (!currentPlayer.currentTask) {
                currentPlayer.currentTask = getRandomTaskForPlayer();
                currentPlayer.currentTaskIndex = (currentPlayer.currentTaskIndex || 0) + 1;
            }
            currentTask = currentPlayer.currentTask;
            document.getElementById('taskNum').innerHTML = currentTask.num;
            document.getElementById('taskText').innerHTML = currentTask.text;
            document.getElementById('roundResult').innerHTML = `🎲 ХОД: ${currentPlayer.name} | Задание ${currentPlayer.currentTaskIndex} | +${points} очков`;
            updateRoyalUI();
        }
        else if (mode === 'endless') {
            const tasks = getTasks();
            currentTask = tasks[Math.floor(Math.random() * tasks.length)];
            document.getElementById('taskNum').innerHTML = currentTask.num;
            document.getElementById('taskText').innerHTML = currentTask.text;
            document.getElementById('roundResult').innerHTML = `♾️ Бесконечный режим | +${points} монет за правильный ответ`;
        }
        
        document.getElementById('answerInput').value = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'none';
    }
    
    function checkAnswer() {
        if (waitingForNext) return;
        const userAnswer = document.getElementById('answerInput').value;
        if (!userAnswer) { document.getElementById('feedback').className = 'feedback wrong'; document.getElementById('feedback').innerHTML = '⚠️ Введите ответ!'; return; }
        
        let isCorrect = false;
        const num = parseFloat(userAnswer);
        if (!isNaN(num) && currentTask.decimal !== null) isCorrect = Math.abs(num - currentTask.decimal) < 0.01;
        else if (userAnswer.includes('/')) { let p = userAnswer.split('/'); if (p.length===2) isCorrect = Math.abs(parseFloat(p[0])/parseFloat(p[1]) - currentTask.decimal) < 0.01; }
        else isCorrect = userAnswer.trim().toLowerCase() === currentTask.answer.toLowerCase();
        
        const points = getPoints();
        
        if (mode === 'solo') {
            if (isCorrect) { playerCoins += points; document.getElementById('score').innerHTML = playerCoins; document.getElementById('feedback').className = 'feedback correct'; document.getElementById('feedback').innerHTML = `✅ ПРАВИЛЬНО! +${points} монет`; shieldActive = false; }
            else { if (shieldActive) { document.getElementById('feedback').innerHTML = `🛡️ ЩИТ защитил! Ответ: ${currentTask.answer}`; shieldActive = false; } else { playerLives--; document.getElementById('feedback').innerHTML = `❌ НЕПРАВИЛЬНО! -1 жизнь. Ответ: ${currentTask.answer}`; if (playerLives <= 0) { endGame(false); return; } } }
        }
        else if (mode === 'royal') {
            let p = royalPlayers[currentRoyalPlayer];
            if (p.active) {
                if (isCorrect) { p.score += points; document.getElementById('feedback').innerHTML = `✅ ${p.name} отвечает правильно! +${points} очков`; }
                else { p.lives--; document.getElementById('feedback').innerHTML = `❌ ${p.name} ошибся! -1 жизнь. Ответ: ${currentTask.answer}`; if (p.lives <= 0) p.active = false; }
                updateRoyalUI();
            }
        }
        else if (mode === 'endless') {
            if (isCorrect) { playerCoins += points; document.getElementById('score').innerHTML = playerCoins; document.getElementById('feedback').innerHTML = `✅ +${points} монет`; loadTask(); return; }
            else { endGame(false); return; }
        }
        waitingForNext = true;
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'block';
    }
    
    function nextTask() {
        if (!waitingForNext) return;
        if (mode === 'solo') { currentTaskIndex++; if (currentTaskIndex >= getTasks().length) endGame(true); else loadTask(); }
        else if (mode === 'royal') {
            royalPlayers[currentRoyalPlayer].currentTask = null;
            let next = (currentRoyalPlayer + 1) % 4;
            for (let i=0; i<4; i++) { let idx = (currentRoyalPlayer+1+i)%4; if (royalPlayers[idx].active) { next=idx; break; } }
            currentRoyalPlayer = next;
            loadTask();
        }
    }
    
    function endGame(isWin) {
        let msg = '';
        let stars = '';
        let text = '';
        if (mode === 'royal') {
            let winner = royalPlayers.find(p => p.active);
            msg = winner ? `🏆 ПОБЕДИТЕЛЬ: ${winner.name}\n${winner.score} очков!` : 'Ничья!';
            if (winner && winner.name === "ВЫ") playerCoins += winner.score;
            stars = '⭐⭐⭐⭐⭐';
            text = winner ? (winner.name === "ВЫ" ? 'ВЫ ПОБЕДИЛИ!' : 'ПОБЕДИЛ КОМПЬЮТЕР') : 'НИЧЬЯ';
        } else if (isWin) { msg = `🏆 ПОБЕДА!\n${playerCoins} монет!`; stars = '⭐⭐⭐⭐⭐'; text = 'ВЫ СДАЛИ ЕГЭ!'; }
        else { msg = `😔 ПОРАЖЕНИЕ!\n${playerCoins} монет`; stars = playerCoins >= 100 ? '⭐⭐⭐' : '⭐⭐'; text = 'Попробуйте ещё раз!'; }
        document.getElementById('finalScore').innerHTML = msg;
        document.getElementById('rating').innerHTML = stars;
        document.getElementById('ratingText').innerHTML = text;
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');
    }
    
    function openShop() {
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('shopScreen').classList.remove('hidden');
        document.getElementById('shopCoins').innerHTML = playerCoins;
        const container = document.getElementById('shopItems');
        container.innerHTML = '';
        shopItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `<div class="shop-item-emoji">${item.emoji}</div><div class="shop-item-name">${item.name}</div><div class="shop-item-price">💰 ${item.price}</div><div class="shop-item-desc">${item.desc}</div>`;
            div.onclick = () => {
                if (playerCoins >= item.price) { playerCoins -= item.price; inventory[item.effect]++; document.getElementById('score').innerHTML = playerCoins; document.getElementById('shopCoins').innerHTML = playerCoins; updateInventoryDisplay(); alert(`✅ Куплено: ${item.name}!`); openShop(); }
                else alert(`❌ Не хватает! Нужно ${item.price} монет`);
            };
            container.appendChild(div);
        });
    }
    
    // Выход на главную страницу сайта (index.html)
    function exitToMainSite() {
        window.location.href = 'index.html';
    }
    
    function startGame() {
        playerCoins = 100;
        playerLives = 3; yashcherLives = 3; currentTaskIndex = 0; waitingForNext = false; shieldActive = false;
        inventory = { spurs: 0, shield: 0, medkit: 0, sword: 0, poison: 0, chest: 0, exam100: 0, victory: 0 };
        royalPlayers = [
            { name: "ВЫ", emoji: "👤", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
            { name: "Анна", emoji: "👩‍🎓", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
            { name: "Профилич", emoji: "👨‍🏫", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 },
            { name: "Ящер", emoji: "🐊", lives: 3, score: 0, active: true, currentTask: null, currentTaskIndex: 0 }
        ];
        currentRoyalPlayer = 0;
        mode = document.getElementById('modeSelect').value;
        difficulty = document.getElementById('difficultySelect').value;
        document.getElementById('score').innerHTML = playerCoins;
        document.getElementById('yashcherLives').innerHTML = '3';
        document.getElementById('yashcherScore').innerHTML = '0';
        document.getElementById('playersPanel').style.display = mode === 'royal' ? 'flex' : 'none';
        if (mode === 'royal') updateRoyalUI();
        updateInventoryDisplay();
        loadTask();
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('shopScreen').classList.add('hidden');
    }
    
    document.getElementById('startGameBtn').onclick = startGame;
    document.getElementById('modeSelect').onchange = () => { mode = document.getElementById('modeSelect').value; startGame(); };
    document.getElementById('difficultySelect').onchange = () => { difficulty = document.getElementById('difficultySelect').value; startGame(); };
    document.getElementById('submitBtn').onclick = checkAnswer;
    document.getElementById('nextBtn').onclick = nextTask;
    document.getElementById('shopBtn').onclick = openShop;
    document.getElementById('closeShopBtn').onclick = () => { document.getElementById('shopScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden'); updateInventoryDisplay(); };
    document.getElementById('restartBtn').onclick = () => { document.getElementById('resultScreen').classList.add('hidden'); startGame(); };
    document.getElementById('exitBtn').onclick = exitToMainSite;
    document.getElementById('exitMainBtn').onclick = exitToMainSite;
</script>
</body>
</html>
